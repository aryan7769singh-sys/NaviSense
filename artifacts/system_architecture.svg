  <text fill="#7A8A8C" font-size="10.5" letter-spacing="0.7" x="24" y="44">PHONE SENSORS PHONE SENSORS â€” UNCALIBRATED, FASTEST RATE THE DEVICE GIVESmdash; UNCALIBRATED, FASTEST RATE</text>
