<?xml version="1.0" encoding="UTF-8"?>
<svg width="1760" height="712" viewBox="0 0 1760 712" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'IBM Plex Mono', ui-monospace, monospace" role="img" aria-label="Full system architecture of the NaviSense intelligent dead reckoning system: phone IMU and GNSS feed CaptureService, which drives both a runtime plane (NavEngine: alignment and vibration at raw rate, decimation, rotation, ring buffer, ONNX inference, speed filter, dead reckoning) and a data plane (CSV, quality gates, upload, collection, trajectory split, training, ONNX export), joined by the exported model file.">
